[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestream"
version = "0.3.0"
description = "Bulk content migration from any source (WSS/SharePoint, file shares, SQL BLOBs, CSV exports, S3, CMIS) into IBM FileNet: pluggable, restartable, built for 100 TB+. Zero dependencies: the SQL Server driver is bundled."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/lodestream/_vendor/LICENSE-python-tds.txt"]
authors = [{ name = "Karthikeyan Balasundaram" }]
keywords = ["filenet", "ecm", "content migration", "sharepoint", "wss", "cmis", "bulk import", "tds", "document management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
# Deliberately empty: nothing is downloaded at install time. pyodbc, boto3 and PyYAML are used
# only if already installed.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15", "myst-parser>=2", "sphinx-copybutton", "sphinx-design"]

[project.urls]
Homepage = "https://github.com/karthikbd/lodestream"
Documentation = "https://lodestream.readthedocs.io"
Source = "https://github.com/karthikbd/lodestream"
Issues = "https://github.com/karthikbd/lodestream/issues"
Changelog = "https://github.com/karthikbd/lodestream/blob/main/CHANGELOG.md"

[project.scripts]
lodestream = "lodestream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lodestream = ["_vendor/LICENSE-python-tds.txt", "py.typed", "examples/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:lodestream._vendor"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
extend-exclude = ["src/lodestream/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "S", "C4", "PIE", "RUF"]
ignore = ["B008", "B023", "B027", "B905", "E501", "E731", "SIM105", "SIM115", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# SQL text is built only from fixed fragments, "?" placeholders and configured queries; values are always
# bound parameters (S608 can't see that)
"src/lodestream/manifest.py" = ["S608"]
"src/lodestream/sources/sql_blob.py" = ["S608"]
"src/lodestream/sources/wss_sql.py" = ["S608"]
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S310", "S311", "S603", "S607", "S608", "RUF012", "RUF015", "RUF059"]
"src/lodestream/registry.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = ["src/lodestream/_vendor/"]

[[tool.mypy.overrides]]
module = "lodestream._vendor.*"
ignore_errors = true      # vendored python-tds, kept as upstream wrote it

[tool.coverage.run]
source = ["lodestream"]
omit = ["*/_vendor/*"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true
