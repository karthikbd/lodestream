# lodestream: file share / NFS / SMB mount -> IBM FileNet (streams directly, no staging)
name = "fileshare-to-filenet"
manifest = "./state/manifest.db"

[source]
type = "filesystem"
options = { root = "/mnt/legacy_share" }  # each top-level folder is scanned in parallel

[sink]
type = "filenet_graphql"

[sink.options]
endpoint = "https://cpe.example.com/content-services-graphql/graphql"
repository = "OS1"
auth = { type = "basic", username = "${FN_USER}", password = "${FN_PASSWORD}" }

[mapping]
default_class = "Document"
folder = "/Migrated/{directory}"
properties = { _source_id = "MigrationSourceId" }

[[steps]]
name = "inventory"
workers = 8

[[steps]]
name = "filter"
exclude_patterns = ["*/thumbs.db", "*.tmp", "*/~$*"]
min_size = 1

[[steps]]
name = "load"
workers = 32
batch_size = 50

[[steps]]
name = "verify"
workers = 16
report = "./state/report.json"
